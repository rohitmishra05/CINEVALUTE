<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineVault - Your Personal Cinema Universe</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <!-- CSS Files -->
    <link rel="stylesheet" href="assets/css/variables.css">
    <link rel="stylesheet" href="assets/css/reset.css">
    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/animations.css">
    <link rel="stylesheet" href="assets/css/components.css">
</head>
<body>
    <div id="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar glass-panel">
            <div class="logo-container">
                <i class="ph ph-film-strip" style="font-size: 2rem; color: var(--accent-primary);"></i>
                <h2 class="logo-text" style="margin: 0; font-size: 1.5rem;">Cine<span class="text-primary">Vault</span></h2>
            </div>
            
            <nav class="main-nav">
                <a href="#home" class="nav-link" data-route="home">
                    <i class="ph ph-squares-four"></i>
                    <span class="nav-text">Dashboard</span>
                </a>
                <a href="#search" class="nav-link" data-route="search">
                    <i class="ph ph-magnifying-glass"></i>
                    <span class="nav-text">Discover</span>
                </a>
                <a href="#movies" class="nav-link" data-route="movies">
                    <i class="ph ph-video-camera"></i>
                    <span class="nav-text">My Movies</span>
                </a>
                <a href="#collections" class="nav-link" data-route="collections">
                    <i class="ph ph-folders"></i>
                    <span class="nav-text">Collections</span>
                </a>
                <a href="#series" class="nav-link" data-route="series">
                    <i class="ph ph-television"></i>
                    <span class="nav-text">📺 Web Series</span>
                </a>
                <a href="#series-search" class="nav-link" data-route="series-search">
                    <i class="ph ph-magnifying-glass-plus"></i>
                    <span class="nav-text">🔍 Discover Series</span>
                </a>
                <a href="#stats" class="nav-link hide-on-mobile" data-route="stats">
                    <i class="ph ph-chart-line-up"></i>
                    <span class="nav-text">Statistics</span>
                </a>
                <a href="#picker" class="nav-link hide-on-mobile" data-route="picker">
                    <i class="ph ph-dice-five"></i>
                    <span class="nav-text">Random Picker</span>
                </a>
                <a href="#settings" class="nav-link settings-nav" data-route="settings">
                    <i class="ph ph-gear"></i>
                    <span class="nav-text">Settings</span>
                </a>
            </nav>

            <div style="margin-top: auto; padding: 1.5rem 1rem; text-align: center; color: var(--text-muted); font-size: 0.85rem; font-weight: 500; letter-spacing: 0.05em;">
                With Love RO 🫶🏻
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <!-- Topbar -->
            <header class="topbar">
                <div class="page-title">
                    <h2 id="current-page-title">Dashboard</h2>
                </div>
                <div class="topbar-actions" style="display: flex; gap: 1rem; align-items: center;">
                    <div class="input-group" style="width: 250px;">
                        <i class="ph ph-magnifying-glass input-icon"></i>
                        <input type="text" class="input-field" placeholder="Quick search vault..." id="quick-search">
                    </div>
                    <button class="btn-icon" title="Notifications">
                        <i class="ph ph-bell"></i>
                    </button>
                    <div class="user-profile" style="width: 40px; height: 40px; border-radius: 50%; background: var(--bg-tertiary); border: 2px solid var(--accent-primary); display: flex; align-items: center; justify-content: center; cursor: pointer;">
                        <i class="ph ph-user" style="color: var(--text-primary);"></i>
                    </div>
                </div>
            </header>

            <!-- Dynamic Views (Injected by JS) -->
            <div id="view-home" class="view-container active">
                <h1 class="animate-slide-up">Welcome to CineVault</h1>
                <p class="text-secondary animate-slide-up delay-100">Your personal cinema universe.</p>
                <!-- Dashboard content will be generated by JS -->
            </div>
            
            <div id="view-search" class="view-container"></div>
            <div id="view-movies" class="view-container"></div>
            <div id="view-collections" class="view-container"></div>
            <div id="view-stats" class="view-container"></div>
            <div id="view-picker" class="view-container"></div>
            <div id="view-settings" class="view-container"></div>
            <div id="view-movie-detail" class="view-container"></div>
            <div id="view-series" class="view-container"></div>
            <div id="view-series-search" class="view-container"></div>
            <div id="view-series-detail" class="view-container"></div>
        </main>
    </div>

    <!-- Scoped styles for navigation links -->
    <style>
        .nav-link {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.75rem 1rem;
            color: var(--text-secondary);
            border-radius: var(--radius-md);
            transition: all var(--transition-fast);
            font-size: 1rem;
            font-weight: 500;
        }
        .nav-link:hover {
            background-color: var(--bg-tertiary);
            color: var(--text-primary);
        }
        .nav-link.active {
            background-color: var(--accent-gold-dim);
            color: var(--accent-gold);
        }
        .nav-link i {
            font-size: 1.25rem;
        }
    </style>

    <!-- Scripts -->
    <script type="module" src="assets/js/app.js"></script>
</body>
</html>
